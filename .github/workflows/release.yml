name: release
on:
  push:
    tags: ['v*']
env:
  PDFIUM_RELEASE: chromium/8035
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pdfium: linux-x64
            libdir: lib
            sha256: 2e6db042dd2cff2d5247023dbec6c7ebb800042ce83c835d6468d45229669bd4
          - os: ubuntu-24.04-arm
            pdfium: linux-arm64
            libdir: lib
            sha256: 10bb7728a5268593a31c2024e0e57ea26b73b7a54195054f43d2ad0869d55a48
          - os: windows-latest
            pdfium: win-x64
            libdir: bin
            sha256: 61513d611ad200a383456140739be77d156f1e3a2eef22bd89f6c3bda79bdd41
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: tag matches Cargo.toml
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" Cargo.toml
      - run: cargo build --release
      - name: fetch pdfium
        run: |
          curl -sfL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-${{ matrix.pdfium }}.tgz" -o pdfium.tgz
          echo "${{ matrix.sha256 }}  pdfium.tgz" | sha256sum -c
          mkdir -p pdfium && tar xzf pdfium.tgz -C pdfium
      - run: PDFIUM_PATH=pdfium/${{ matrix.libdir }} tests/smoke.sh
      - name: package
        run: |
          D=pdfiumtoppm-${GITHUB_REF_NAME}-${{ matrix.pdfium }}
          mkdir "$D"
          if [ "${RUNNER_OS}" = Windows ]; then
            cp target/release/pdfiumtoppm.exe pdfium/bin/pdfium.dll "$D/"
          else
            cp target/release/pdfiumtoppm pdfium/lib/libpdfium.so "$D/"
          fi
          cp LICENSE NOTICE README.md CHANGES.md "$D/"
          mkdir "$D/licenses"
          cp pdfium/LICENSE "$D/licenses/pdfium-binaries.txt"
          cp pdfium/licenses/* "$D/licenses/"
          cp pdfium/VERSION "$D/licenses/pdfium-VERSION"
          if [ "${RUNNER_OS}" = Windows ]; then
            7z a "$D.zip" "$D" > /dev/null
            sha256sum "$D.zip" > "$D.zip.sha256"
          else
            tar czf "$D.tar.gz" "$D"
            sha256sum "$D.tar.gz" > "$D.tar.gz.sha256"
          fi
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            pdfiumtoppm-*.tar.gz
            pdfiumtoppm-*.tar.gz.sha256
            pdfiumtoppm-*.zip
            pdfiumtoppm-*.zip.sha256
