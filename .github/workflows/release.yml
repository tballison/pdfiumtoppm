name: release
on:
  push:
    tags: ['v*']
env:
  PDFIUM_RELEASE: chromium/8125
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pdfium: linux-x64
            libdir: lib
            library: libpdfium.so
            sha256: e1c3ce6e270cb5e0c20816b379ad9f2c1309972697c505f508de92bf5e7d6659
          - os: ubuntu-24.04-arm
            pdfium: linux-arm64
            libdir: lib
            library: libpdfium.so
            sha256: 8b8818f2ec57d1b213d952ca6d7f0ffeca9d0110487d0e20ad83ba918bc92efa
          - os: windows-latest
            pdfium: win-x64
            libdir: bin
            library: pdfium.dll
            sha256: 9a964261760cff52570aabf038ab346d3a5034dd8b30d0d5fe8861235d356b8b
          - os: macos-15
            pdfium: mac-arm64
            libdir: lib
            library: libpdfium.dylib
            sha256: 4939bd935ac83ddc09a3a4f038bc43a19cea1660316a3667f26cb07a070e139d
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: tag matches Cargo.toml
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" Cargo.toml
      - name: release notes from CHANGES.md
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="$V" '$0 == "## " v {f=1; next} f && /^## / {exit} f' CHANGES.md \
            | sed '/./,$!d' > notes.md
          # fail before publishing anything rather than ship empty notes
          grep -q '[^[:space:]]' notes.md || { echo "CHANGES.md has no '## $V' section"; exit 1; }
          cat notes.md
      - run: cargo build --release
      - name: fetch pdfium
        run: |
          curl -sfL "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-${{ matrix.pdfium }}.tgz" -o pdfium.tgz
          # macOS sha256sum is BSD's and cannot -c from stdin
          if [ "${RUNNER_OS}" = macOS ]; then
            echo "${{ matrix.sha256 }}  pdfium.tgz" | shasum -a 256 -c
          else
            echo "${{ matrix.sha256 }}  pdfium.tgz" | sha256sum -c
          fi
          mkdir -p pdfium && tar xzf pdfium.tgz -C pdfium
      - run: PDFIUM_PATH=pdfium/${{ matrix.libdir }} tests/smoke.sh
      - name: package
        run: |
          D=pdfiumtoppm-${GITHUB_REF_NAME}-${{ matrix.pdfium }}
          mkdir "$D"
          if [ "${RUNNER_OS}" = Windows ]; then
            cp target/release/pdfiumtoppm.exe "pdfium/${{ matrix.libdir }}/${{ matrix.library }}" "$D/"
          else
            cp target/release/pdfiumtoppm "pdfium/${{ matrix.libdir }}/${{ matrix.library }}" "$D/"
          fi
          cp LICENSE NOTICE README.md CHANGES.md "$D/"
          mkdir "$D/licenses"
          cp pdfium/LICENSE "$D/licenses/pdfium-binaries.txt"
          cp pdfium/licenses/* "$D/licenses/"
          cp pdfium/VERSION "$D/licenses/pdfium-VERSION"
          if [ "${RUNNER_OS}" = Windows ]; then
            7z a "$D.zip" "$D" > /dev/null
            sha256sum "$D.zip" > "$D.zip.sha256"
          elif [ "${RUNNER_OS}" = macOS ]; then
            zip -qr "$D.zip" "$D"
            shasum -a 256 "$D.zip" > "$D.zip.sha256"
          else
            tar czf "$D.tar.gz" "$D"
            sha256sum "$D.tar.gz" > "$D.tar.gz.sha256"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: |
            pdfiumtoppm-*.tar.gz
            pdfiumtoppm-*.tar.gz.sha256
            pdfiumtoppm-*.zip
            pdfiumtoppm-*.zip.sha256
